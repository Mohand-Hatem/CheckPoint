name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  api-verification:
    name: Backend API (Build, Typecheck & Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate & Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build NestJS API
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit

  api-e2e:
    name: Backend API (End-to-End on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: checkpoint_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d checkpoint_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/checkpoint_ci?schema=public"
      JWT_ACCESS_SECRET: "ci-only-secret-not-used-anywhere-else"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run End-to-End Tests (isolation, invitations, session security)
        run: npm run test:e2e
