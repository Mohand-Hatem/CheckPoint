services:
  api:
    build:
      context: ./apps/api
    container_name: checkpoint-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env

    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: checkpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"