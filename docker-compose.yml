services:
  api:
    build:
      context: ./apps/api
    container_name: checkpoint-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: checkpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkpoint_user
      POSTGRES_PASSWORD: MyStrongPassword_2026_X9
      POSTGRES_DB: checkpoint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    

  redis:
    image: redis:7-alpine
    container_name: checkpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: