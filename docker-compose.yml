services:
  api:
    build:
      context: ./apps/api
    container_name: checkpoint-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: checkpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkpoint_user
      POSTGRES_PASSWORD: MyStrongPassword_2026_X9
      POSTGRES_DB: checkpoint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    

  redis:
    image: redis:7-alpine
    container_name: checkpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: